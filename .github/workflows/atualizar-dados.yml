name: Atualizar dados (HenrikDev)

# Busca os números do squad na HenrikDev API e republica o site quando alguém jogou.
# Precisa do segredo HENRIK_API_KEY no repositório (Settings > Secrets and variables > Actions).
on:
  schedule:
    - cron: '17 */3 * * *' # a cada 3 horas (horário UTC)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Coletar na HenrikDev API
        run: node tools/collect-henrik.mjs
        env:
          HENRIK_API_KEY: ${{ secrets.HENRIK_API_KEY }}

      - name: Ver se tem partida nova
        id: novo
        run: |
          if git diff --quiet -- match-cache.json && git ls-files --error-unmatch match-cache.json >/dev/null 2>&1; then
            echo "mudou=false" >> "$GITHUB_OUTPUT"; echo "Sem partidas novas."
          else
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Montar squad-data.json
        if: steps.novo.outputs.mudou == 'true'
        run: |
          node tools/build-data.mjs | tee build.log
          if grep -q 'ATO NOVO' build.log; then node tools/snapshot-goals.mjs --novo; else node tools/snapshot-goals.mjs; fi
          rm build.log

      - name: Publicar
        if: steps.novo.outputs.mudou == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add squad-data.json match-cache.json
          git commit -m "Dados de $(TZ=America/Sao_Paulo date +%Y-%m-%d) (HenrikDev)"
          git push
          # push feito pelo próprio workflow não dispara outro workflow; chama o deploy na mão
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
